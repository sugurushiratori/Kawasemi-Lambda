<style>
  :root { --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5d6778; --line:#dde2ea; --accent:#2f6fde; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  #app { display:flex; height:100%; }
  #panel { width:360px; min-width:300px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:14px 16px 24px; }
  #view { flex:1; position:relative; min-width:0; }
  #canvas { width:100%; height:100%; display:block; }
  h1 { font-size:17px; margin:0 0 2px; }
  h1 img.logo { width:230px; height:auto; display:block; margin:2px 0 4px -6px; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:10px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; border-top:1px solid var(--line); padding-top:12px; }
  label { display:block; margin:6px 0 2px; font-size:13px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  input[type=number], select { width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  input[type=range] { width:100%; }
  .check { display:flex; align-items:center; gap:6px; margin:8px 0 2px; font-size:13px; }
  .check input { margin:0; }
  .note { color:var(--muted); font-size:12px; margin:4px 0; }
  table.res { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric: tabular-nums; }
  table.res td { padding:3px 2px; border-bottom:1px solid #eef1f5; vertical-align:top; }
  table.res td.v { text-align:right; white-space:nowrap; }
  .warn { color:#b04a00; font-size:12.5px; margin:6px 0; }
  .lang { float:right; font-size:12px; }
  .lang button { border:1px solid var(--line); background:#fff; border-radius:5px; padding:2px 7px; cursor:pointer; font:inherit; }
  .lang button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.play { padding:5px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font:inherit; }
  #overlay { position:absolute; left:150px; bottom:12px; font-size:12px; color:#e4e7ee; max-width:60%; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  #bars { position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; gap:22px; color:#fff; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .sbar { display:flex; flex-direction:column; align-items:center; }
  .sbt { text-align:center; margin-bottom:6px; line-height:1.25; }
  .sbb { display:flex; gap:6px; height:220px; }
  .sbg { width:16px; border:1px solid rgba(255,255,255,.7); }
  .sbl { display:flex; flex-direction:column; justify-content:space-between; font-variant-numeric:tabular-nums; }
  #toolbar { position:absolute; left:10px; right:10px; top:10px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  #toolbar .grp { pointer-events:auto; display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:8px; padding:5px 10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #toolbar label { display:flex; align-items:center; gap:6px; margin:0; font-size:12.5px; white-space:nowrap; }
  #toolbar input[type=range] { width:96px; }
  #toolbar select { width:auto; padding:3px 5px; }
  #toolbar .check { margin:0; }
  #toolbar button.play { width:38px; padding:4px 0; }
  button.ghost { border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 9px; cursor:pointer; font:inherit; font-size:12.5px; }
  #status { position:absolute; right:12px; bottom:10px; border-radius:6px; padding:4px 9px; font-size:12px; color:#e4e7ee; }
  .bar { height:8px; border-radius:4px; margin:3px 0; }
  footer { color:var(--muted); font-size:11.5px; margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  @media (max-width: 760px) { #app { flex-direction:column; } #panel { width:100%; height:48%; border-right:none; border-bottom:1px solid var(--line);} }
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="toolbar"></div>
    <div id="status"></div>
    <div id="overlay"></div>
    <div id="bars"></div>
  </div>
</div>
