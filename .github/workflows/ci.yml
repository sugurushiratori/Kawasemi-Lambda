name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deps: system
          - os: ubuntu-latest
            deps: fetch
          - os: macos-latest
            deps: system
          - os: windows-latest
            deps: fetch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Ubuntu)
        if: runner.os == 'Linux' && matrix.deps == 'system'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libyaml-cpp-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen yaml-cpp

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.deps == 'fetch' && '-DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON -DCMAKE_DISABLE_FIND_PACKAGE_yaml-cpp=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  reference:
    # the reference roots in tests/reference must be reproducible from the Python tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath
      - run: python tools/make_reference.py && git diff --exit-code tests/reference
